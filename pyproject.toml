[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-occupancy-forecast"
version = "0.1.0"
description = "Open-source free-space forecasting for multi-storey car parks: 15 min to 2 h ahead, quantile intervals, full-by warning and re-routing guidance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
parking-forecast = "parking_forecast.cli:main"

[tool.setuptools]
packages = ["parking_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"parking_forecast/figures.py" = ["E501"]
